[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "erbga"
version = "1.0.0.dev0"
description = "Connected, objective-agnostic community detection with a genetic algorithm"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aditya Karnam" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest", "networkx"]

[project.scripts]
erbga = "erbga.cli:main"

[tool.setuptools]
packages = ["erbga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
