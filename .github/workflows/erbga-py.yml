name: erbga-py

on:
  push:
    paths: ["erbga_py/**", ".github/workflows/erbga-py.yml"]
  pull_request:
    paths: ["erbga_py/**", ".github/workflows/erbga-py.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: erbga_py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" ruff
      - run: ruff check --select E,F,W,B,UP --target-version py39 --line-length 100 .
      - run: pytest -q
